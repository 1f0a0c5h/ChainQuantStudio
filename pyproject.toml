[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chain-quant-studio"
version = "1.0.0"
description = "Desktop-first multi-agent quantitative research studio framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CHA!N Quant Studio contributors" }]
dependencies = [
    "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]
research = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
]
studio = [
    "openai-codex>=0.154,<0.155",
]

[project.scripts]
quant-signal-agent = "quant_signal_agent.main:main"
qsa-backtest = "quant_signal_agent.backtesting.cli:main"
qsa-studio = "quant_signal_agent.studio.gateway:main"
qsa-spec = "quant_signal_agent.specs.cli:main"
qsa-data = "quant_signal_agent.studio.tooling:data_main"
qsa-artifacts = "quant_signal_agent.studio.tooling:artifacts_main"
qsa-release = "quant_signal_agent.studio.release_cli:main"
qsa-runtime = "quant_signal_agent.studio.runtime_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: opt-in tests against unauthenticated public exchange APIs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["quant_signal_agent"]

[tool.coverage.report]
fail_under = 73
show_missing = true
skip_covered = true
