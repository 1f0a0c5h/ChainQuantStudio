<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">CHA!N Quant Studio desktop control surface</title>
  <desc id="desc">Annotated overview of the studio office, employee file, Manager composer, control plane, optional work DAG, and studio communications.</desc>
  <defs>
    <style>
      .bg{fill:#071014}.panel{fill:#101b22;stroke:#2a414a;stroke-width:2}.office{fill:#0d2028;stroke:#52d6c8;stroke-width:2}.desk{fill:#15313a;stroke:#477887;stroke-width:2}.side{fill:#111a25;stroke:#344454;stroke-width:2}.dag{fill:#111a20;stroke:#2a414a;stroke-width:2}.cyan{fill:#6ed8ff}.mint{fill:#52d6c8}.green{fill:#67ed8d}.amber{fill:#ffb45e}.violet{fill:#b998ff}.white{fill:#e9f0ee}.muted{fill:#91a3aa}.dim{fill:#71848d}.title{font:700 30px Arial,sans-serif}.h{font:700 16px Arial,sans-serif}.body{font:14px Arial,sans-serif}.tiny{font:12px Arial,sans-serif}.num{fill:#071014;stroke:#52d6c8;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1600" height="920" rx="22"/>
  <text class="title white" x="42" y="50">CHA<tspan class="green">!</tspan>N · QUANT STUDIO</text>
  <text class="body muted" x="1558" y="47" text-anchor="end">DESKTOP / LOCAL CONTROL · PUBLIC MODE IS READ-ONLY</text>

  <rect class="office" x="40" y="82" width="1090" height="500" rx="16"/>
  <text class="h white" x="65" y="112">VIRTUAL STUDIO FLOOR</text>
  <text class="tiny muted" x="1100" y="111" text-anchor="end">AGENT STATUS · PROGRESS BUBBLES · WALKING HANDOFFS</text>
  <g>
    <rect class="desk" x="75" y="150" width="230" height="105" rx="12"/><text class="h cyan" x="190" y="187" text-anchor="middle">MANAGER AGENT</text><text class="tiny muted" x="190" y="213" text-anchor="middle">Manager Desk</text>
    <rect class="desk" x="335" y="150" width="230" height="105" rx="12"/><text class="h mint" x="450" y="187" text-anchor="middle">STRATEGY AGENT</text><text class="tiny muted" x="450" y="213" text-anchor="middle">Research Desk</text>
    <rect class="desk" x="595" y="150" width="230" height="105" rx="12"/><text class="h violet" x="710" y="187" text-anchor="middle">BACKTEST AGENT</text><text class="tiny muted" x="710" y="213" text-anchor="middle">Simulation Lab</text>
    <rect class="desk" x="855" y="150" width="230" height="105" rx="12"/><text class="h amber" x="970" y="187" text-anchor="middle">REVIEW AGENT</text><text class="tiny muted" x="970" y="213" text-anchor="middle">Review Office</text>
    <rect class="desk" x="75" y="310" width="230" height="105" rx="12"/><text class="h violet" x="190" y="347" text-anchor="middle">OPTIMIZATION AGENT</text><text class="tiny muted" x="190" y="373" text-anchor="middle">Optimization Lab</text>
    <rect class="desk" x="335" y="310" width="230" height="105" rx="12"/><text class="h green" x="450" y="347" text-anchor="middle">SIGNAL AGENT</text><text class="tiny muted" x="450" y="373" text-anchor="middle">Signal Console</text>
    <rect class="desk" x="595" y="310" width="230" height="105" rx="12"/><text class="h amber" x="710" y="347" text-anchor="middle">MAINTENANCE AGENT</text><text class="tiny muted" x="710" y="373" text-anchor="middle">Repair Bay</text>
    <rect class="panel" x="855" y="310" width="230" height="105" rx="12"/><text class="h dim" x="970" y="347" text-anchor="middle">TRADING AGENT</text><text class="tiny dim" x="970" y="373" text-anchor="middle">LOCKED · NO CREDENTIALS</text>
  </g>
  <rect class="panel" x="75" y="458" width="645" height="88" rx="12"/><text class="h white" x="98" y="488">CURRENT WORKFLOW</text><text class="body muted" x="98" y="519">Stage, percent complete, current owner, and the active work-order state.</text>
  <rect class="panel" x="745" y="458" width="340" height="88" rx="12"/><text class="h green" x="768" y="488">STRATEGY TV</text><text class="body muted" x="768" y="519">Registry: active items glow; inactive items stay dim.</text>

  <rect class="side" x="1160" y="82" width="400" height="500" rx="16"/>
  <text class="h violet" x="1185" y="112">EMPLOYEE FILE</text>
  <text class="body white" x="1185" y="147">Selected Agent profile</text>
  <rect class="panel" x="1185" y="170" width="350" height="120" rx="12"/><text class="h cyan" x="1208" y="202">MANAGER COMPOSER</text><text class="tiny muted" x="1208" y="228">Natural-language instruction · spec.md · text · image</text><text class="tiny muted" x="1208" y="252">Artifact type · optional backtest · attachments</text><text class="tiny green" x="1208" y="274">LOCAL DESKTOP ONLY</text>
  <rect class="panel" x="1185" y="312" width="350" height="126" rx="12"/><text class="h amber" x="1208" y="344">CONTROL PLANE</text><text class="tiny muted" x="1208" y="370">Codex SDK · global circuit · user blockers</text><text class="tiny muted" x="1208" y="393">dead letters · artifacts · datasets</text><text class="tiny muted" x="1208" y="416">approval notes and explicit operator decisions</text>
  <rect class="panel" x="1185" y="460" width="350" height="86" rx="12"/><text class="h violet" x="1208" y="491">BACKTEST FILES</text><text class="tiny muted" x="1208" y="518">Reports · data provenance · chart preview modal</text>

  <rect class="dag" x="40" y="620" width="1520" height="150" rx="16"/>
  <text class="h white" x="65" y="652">OPTIONAL WORK DAG</text>
  <text class="tiny muted" x="1535" y="651" text-anchor="end">IMPLEMENTATION · OPTIMIZATION · BACKTEST · LIVE APPROVALS</text>
  <g class="tiny">
    <rect class="num" x="70" y="680" width="132" height="54" rx="9"/><text class="mint" x="136" y="712" text-anchor="middle">MANAGER</text>
    <rect class="num" x="222" y="680" width="132" height="54" rx="9"/><text class="mint" x="288" y="712" text-anchor="middle">STRATEGY</text>
    <rect class="num" x="374" y="680" width="132" height="54" rx="9"/><text class="amber" x="440" y="712" text-anchor="middle">REVIEW</text>
    <rect class="num" x="526" y="680" width="132" height="54" rx="9"/><text class="amber" x="592" y="712" text-anchor="middle">GATE</text>
    <rect class="num" x="678" y="680" width="156" height="54" rx="9"/><text class="violet" x="756" y="712" text-anchor="middle">DATA + BACKTEST</text>
    <rect class="num" x="854" y="680" width="132" height="54" rx="9"/><text class="violet" x="920" y="712" text-anchor="middle">OPTIMIZE</text>
    <rect class="num" x="1006" y="680" width="132" height="54" rx="9"/><text class="amber" x="1072" y="712" text-anchor="middle">GATES</text>
    <rect class="num" x="1158" y="680" width="132" height="54" rx="9"/><text class="green" x="1224" y="712" text-anchor="middle">SIGNAL OPS</text>
    <rect class="panel" x="1310" y="680" width="210" height="54" rx="9"/><text class="dim" x="1415" y="712" text-anchor="middle">TRADING LOCKED</text>
  </g>

  <rect class="panel" x="40" y="800" width="1520" height="82" rx="16"/>
  <text class="h cyan" x="65" y="832">STUDIO COMMS</text>
  <text class="body muted" x="65" y="856">Timestamped progress, handoffs, blockers, approval outcomes, runtime state, and recovery messages.</text>

</svg>
